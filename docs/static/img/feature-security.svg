<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Security icon">
  <defs>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#818cf8" />
    </linearGradient>
  </defs>

  <!-- Shield outline -->
  <path
    d="M24 4 L40 10 L40 24 C40 33 32 40 24 44 C16 40 8 33 8 24 L8 10 Z"
    stroke="url(#sec-grad)"
    stroke-width="2.5"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Shield fill (subtle) -->
  <path
    d="M24 7 L37.5 12.5 L37.5 24 C37.5 31.5 30.5 37.5 24 41 C17.5 37.5 10.5 31.5 10.5 24 L10.5 12.5 Z"
    fill="#6366f1"
    opacity="0.1"
  />

  <!-- Lock body -->
  <rect x="18" y="26" width="12" height="9" rx="2" fill="url(#sec-grad)" />

  <!-- Lock shackle -->
  <path
    d="M20 26 L20 21 C20 17.7 28 17.7 28 21 L28 26"
    stroke="url(#sec-grad)"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Keyhole -->
  <circle cx="24" cy="30" r="2" fill="white" opacity="0.9" />
  <rect x="23" y="31" width="2" height="2.5" rx="0.5" fill="white" opacity="0.9" />
</svg>
