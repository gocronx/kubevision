<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Real-time sync icon">
  <defs>
    <linearGradient id="rt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#818cf8" />
    </linearGradient>
  </defs>

  <!-- Lightning bolt (main shape) -->
  <path
    d="M27 4 L13 26 H22 L21 44 L35 22 H26 Z"
    fill="url(#rt-grad)"
    stroke="#6366f1"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- Signal arcs on the left -->
  <path d="M8 14 Q4 24 8 34" stroke="#818cf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M5 10 Q-1 24 5 38" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" />

  <!-- Signal arcs on the right -->
  <path d="M40 14 Q44 24 40 34" stroke="#818cf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M43 10 Q49 24 43 38" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" />
</svg>
