<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Terminal icon">
  <defs>
    <linearGradient id="term-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#818cf8" />
    </linearGradient>
  </defs>

  <!-- Terminal window frame -->
  <rect x="4" y="8" width="40" height="32" rx="4" ry="4" stroke="url(#term-grad)" stroke-width="2" fill="none" />

  <!-- Title bar separator -->
  <line x1="4" y1="16" x2="44" y2="16" stroke="url(#term-grad)" stroke-width="1.5" opacity="0.5" />

  <!-- Window control dots -->
  <circle cx="10" cy="12" r="1.8" fill="#818cf8" opacity="0.6" />
  <circle cx="16" cy="12" r="1.8" fill="#818cf8" opacity="0.6" />
  <circle cx="22" cy="12" r="1.8" fill="#818cf8" opacity="0.6" />

  <!-- Prompt chevron -->
  <polyline points="10,24 15,28 10,32" stroke="url(#term-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Command text lines -->
  <line x1="18" y1="28" x2="30" y2="28" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />

  <!-- Blinking cursor block -->
  <rect x="31" y="24.5" width="6" height="7" rx="1" fill="#818cf8" opacity="0.75" />

  <!-- Second line of text (output) -->
  <line x1="10" y1="36" x2="36" y2="36" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
</svg>
