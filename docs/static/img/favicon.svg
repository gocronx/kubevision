<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="KubeVision favicon">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#818cf8" />
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="8" cy="8" r="7" fill="none" stroke="url(#fg)" stroke-width="1.2" />

  <!-- 7 spokes -->
  <line x1="8" y1="8" x2="8" y2="1.2" stroke="url(#fg)" stroke-width="1" stroke-linecap="round" />
  <line x1="8" y1="8" x2="13.1" y2="2.9" stroke="url(#fg)" stroke-width="1" stroke-linecap="round" />
  <line x1="8" y1="8" x2="14.1" y2="9.7" stroke="url(#fg)" stroke-width="1" stroke-linecap="round" />
  <line x1="8" y1="8" x2="10.7" y2="14.1" stroke="url(#fg)" stroke-width="1" stroke-linecap="round" />
  <line x1="8" y1="8" x2="5.3" y2="14.1" stroke="url(#fg)" stroke-width="1" stroke-linecap="round" />
  <line x1="8" y1="8" x2="1.9" y2="9.7" stroke="url(#fg)" stroke-width="1" stroke-linecap="round" />
  <line x1="8" y1="8" x2="2.9" y2="2.9" stroke="url(#fg)" stroke-width="1" stroke-linecap="round" />

  <!-- Inner hub -->
  <circle cx="8" cy="8" r="3.2" fill="url(#fg)" />

  <!-- Eye pupil -->
  <circle cx="8" cy="8" r="1.5" fill="#1e1b4b" />

  <!-- Eye highlight -->
  <circle cx="8.7" cy="7.4" r="0.5" fill="white" opacity="0.9" />
</svg>
