replicaCount: 1

# Persistent SQLite uses a single-writer volume. Keep Recreate unless an
# external database is configured and rolling updates are safe.
deploymentStrategy:
  type: Recreate

image:
  repository: gocronx/kubevision
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

# Name of a pre-created Secret whose keys are KubeVision environment variables,
# for example KUBEVISION_JWT_SECRET, KUBEVISION_ENCRYPT_KEY, and
# KUBEVISION_DB_DSN. The chart never reads or renders the Secret's values.
existingSecret: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kubevision.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

probes:
  startup:
    enabled: true
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 2
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# KubeVision configuration
config:
  server:
    port: 8080
  database:
    driver: sqlite
    dsn: /data/kubevision.db
    # Zero values use driver-specific defaults: SQLite 1/1, PostgreSQL 25/5.
    maxOpenConns: 0
    maxIdleConns: 0
    connMaxLifetime: 0s
    connMaxIdleTime: 0s
    pingTimeout: 5s
  auth:
    jwtSecret: ""  # Auto-generated if empty
    accessTokenTTL: 30m
    refreshTokenTTL: 12h
    publicKey:
      enabled: false
      rpId: ""
      rpDisplayName: KubeVision
      origins: []
      userVerification: required
      counterPolicy: deny
      challengeTTL: 5m
  kubernetes:
    informerResync: 30m
    crdDiscoveryInterval: 5m
  audit:
    enabled: true
    retentionDays: 90
  oauth:
    enabled: false
    providers: []
  registry:
    allowedRegistries:
      - docker.io
      - registry-1.docker.io
    allowedAuthHosts:
      - auth.docker.io
    allowPrivate: false
    allowHTTP: false
  plugins:
    prometheus:
      url: ""
    grafana:
      url: ""
      token: ""
    argocd:
      url: ""
      token: ""

persistence:
  # SQLite persistence supports one writer and therefore one application Pod.
  # Disable persistence and configure an external database before scaling out.
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

rbac:
  create: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1
